name: oc-egress-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - name: probe
        run: |
          set -x
          echo "RUNNER_IP=$(curl -s https://api.ipify.org)"
          cat > /tmp/p.json <<'EOF'
          {"model":"deepseek-v4.1-flash-free","input":[{"role":"user","content":"hi"}],"max_output_tokens":1,"stream":false}
          EOF
          curl -s -D /tmp/h.txt -o /tmp/b.txt -X POST https://opencode.ai/zen/v1/responses \
            -H "x-opencode-client: desktop" -H "User-Agent: opencode/1.18.31" \
            -H "Content-Type: application/json" --data-binary @/tmp/p.json
          echo "=== HEADERS ==="
          cat /tmp/h.txt
          echo "=== BODY ==="
          cat /tmp/b.txt
          echo
